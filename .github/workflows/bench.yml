name: Benchmarks

# Weekly, not per-PR: benchmark noise on shared CI runners makes per-PR
# gating unreliable, and issue #28 explicitly defers an alert threshold
# until two baseline runs exist to compare against. This job's only job for
# now is to capture and upload numbers on a schedule; workflow_dispatch is
# provided so the job (and the threshold-setting work that follows it) can
# be exercised manually without waiting for Monday.
on:
  schedule:
    - cron: '0 6 * * 1' # Monday 06:00 UTC
  workflow_dispatch:

jobs:
  bench:
    name: Run benchmark suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run benchmarks
        run: make bench

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@v0.0.0-20261009192801-be2c69fb417e # x/perf has no tags: an exact pseudo-version

      - name: Format with benchstat
        run: benchstat bench.txt | tee benchstat.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-results-${{ github.run_id }}
          path: |
            bench.txt
            benchstat.txt
