<!DOCTYPE html>
<html>
<head><title>Shop</title><style>.x { color: red }</style></head>
<body>
  <h1 class="page-title">  Spring   Sale </h1>
  <ul id="products">
    <li class="product" data-sku="A1"><a href="/p/a1">Alpha <b>Widget</b></a> <span class="price">$10</span></li>
    <li class="product" data-sku="B2"><a href="/p/b2">Beta Widget</a> <span class="price">$20</span></li>

  </form>

</html>
