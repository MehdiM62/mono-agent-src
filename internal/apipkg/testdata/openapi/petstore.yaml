# Trimmed from the Swagger Petstore OpenAPI 3.0 sample (Apache-2.0,
# https://github.com/swagger-api/swagger-petstore). Kept small for tests.
openapi: 3.0.3
info:
  title: Swagger Petstore
  description: |-
    A sample pet store server.
    Second line is dropped by the converter.
  version: 1.0.17
externalDocs:
  url: https://swagger.io
servers:
  - url: https://petstore3.swagger.io/api/v3
tags:
  - name: pet
  - name: store
paths:
  /pet:
    put:
      tags: [pet]
      summary: Update an existing pet
      operationId: updatePet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
      responses:
        '200':
          description: Successful operation
    post:
      tags: [pet]
      summary: Add a new pet to the store
      operationId: addPet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
      responses:
        '200':
          description: Successful operation
  /pet/findByStatus:
    get:
      tags: [pet]
      summary: Finds Pets by status
      operationId: findPetsByStatus
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            default: available
            enum: [available, pending, sold]
      responses:
        '200':
          description: successful operation
  /pet/findByTags:
    get:
      tags: [pet]
      summary: Finds Pets by tags
      operationId: findPetsByTags
      parameters:
        - name: tags
          in: query
          explode: true
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: successful operation
  /pet/{petId}:
    parameters:
      - $ref: '#/components/parameters/PetId'
    get:
      tags: [pet]
      summary: Find pet by ID
      operationId: getPetById
      responses:
        '200':
          description: successful operation
    delete:
      tags: [pet]
      summary: Deletes a pet
      operationId: deletePet
      parameters:
        - name: api_key
          in: header
          schema:
            type: string
      responses:
        '400':
          description: Invalid pet value
  /pet/{petId}/uploadImage:
    post:
      tags: [pet]
      summary: uploads an image
      operationId: uploadFile
      parameters:
        - $ref: '#/components/parameters/PetId'
        - name: additionalMetadata
          in: query
          schema:
            type: string
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: successful operation
  /store/inventory:
    get:
      tags: [store]
      summary: Returns pet inventories by status
      operationId: getInventory
      responses:
        '200':
          description: successful operation
  /store/order/{orderId}:
    get:
      tags: [store]
      summary: Find purchase order by ID
      operationId: getOrderById
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: successful operation
components:
  parameters:
    PetId:
      name: petId
      in: path
      description: ID of pet
      required: true
      schema:
        type: integer
        format: int64
  schemas:
    Category:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
    Pet:
      required: [name, photoUrls]
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, example: doggie }
        category:
          $ref: '#/components/schemas/Category'
        photoUrls:
          type: array
          items: { type: string }
        status:
          type: string
          description: pet status in the store
          enum: [available, pending, sold]
  securitySchemes:
    petstore_auth:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://petstore3.swagger.io/oauth/authorize
          scopes:
            write:pets: modify pets in your account
            read:pets: read your pets
    api_key:
      type: apiKey
      name: api_key
      in: header
